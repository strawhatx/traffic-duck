[build]
command = "npm run build"
publish = ".next"

[build.environment]
NEXT_PUBLIC_SUPABASE_URL = $NEXT_PUBLIC_SUPABASE_URL
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY = $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = $NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
NEXT_PUBLIC_STRIPE_PRICE_EARLY = $NEXT_PUBLIC_STRIPE_PRICE_EARLY
NEXT_PUBLIC_STRIPE_PRICE_BUILDER = $NEXT_PUBLIC_STRIPE_PRICE_BUILDER
SUPABASE_SERVICE_ROLE_KEY = $SUPABASE_SERVICE_ROLE_KEY
STRIPE_SECRET_KEY = $STRIPE_SECRET_KEY
STRIPE_WEBHOOK_SECRET = $STRIPE_WEBHOOK_SECRET
CRON_SECRET = $CRON_SECRET
TWITTER_APP_ACCESS_TOKEN = $TWITTER_APP_ACCESS_TOKEN
GEMINI_KEY = $GEMINI_KEY
OPENAI_API_KEY = $OPENAI_API_KEY

[[plugins]]
package = "@netlify/plugin-nextjs"

